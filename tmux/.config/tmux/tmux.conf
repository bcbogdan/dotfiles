set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Count sessions from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Ghostty command-key forwarding targets
bind s choose-tree -s
bind Up switch-client -p
bind Down switch-client -n
bind [ previous-window
bind ] next-window
bind 1 select-window -t:=1
bind 2 select-window -t:=2
bind 3 select-window -t:=3
bind 4 select-window -t:=4
bind 5 select-window -t:=5
bind 6 select-window -t:=6
bind 7 select-window -t:=7
bind 8 select-window -t:=8
bind 9 select-window -t:=9
bind x kill-pane
bind w kill-window
bind t new-window -c "#{pane_current_path}"
bind H split-window -h -b -c "#{pane_current_path}"
bind L split-window -h -c "#{pane_current_path}"
bind K split-window -v -b -c "#{pane_current_path}"
bind J split-window -v -c "#{pane_current_path}"
bind f resize-pane -Z
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
bind W kill-session

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @kanagawa-plugins "git time"
set -g @kanagawa-show-powerline true 
set -g @kanagawa-show-timezone false
set -g @kanagawa-show-location false
set -g @kanagawa-military-time true

set -g @kanagawa-git-disable-status true
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @ukiyo-theme "kanagawa/wave"

if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'

set-option -g status-position bottom 

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
