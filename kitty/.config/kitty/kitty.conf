# BEGIN_KITTY_THEME
# Kanagawa
include current-theme.conf
# END_KITTY_THEME

macos_option_as_alt yes 
tab_bar_edge top
draw_minimal_border false
window_border_width 0
window_margin_width 0

font_size 20.0

# map cmd+1 goto_tab 1
# map cmd+2 goto_tab 2
# map cmd+3 goto_tab 3
# map cmd+4 goto_tab 4
# map cmd+5 goto_tab 5
# map cmd+6 goto_tab 6
# map cmd+7 goto_tab 7
# map cmd+8 goto_tab 8

# Window/Tab actions
map cmd+1 send_key ctrl+space 1 
map cmd+2 send_key ctrl+space 2
map cmd+3 send_key ctrl+space 3
map cmd+4 send_key ctrl+space 4
map cmd+5 send_key ctrl+space 5
map cmd+6 send_key ctrl+space 6
map cmd+7 send_key ctrl+space 7
map cmd+8 send_key ctrl+space 8
map cmd+9 send_key ctrl+space 9
map cmd+t send_key ctrl+space c
map cmd+w send_key ctrl+space &
map cmr+r send_key ctrl+,

# Session Actions
map cmd+right send_key ctrl+space )
map cmd+left send_key ctrl+space (
map cmd+shift+r send_key ctsl+space $
