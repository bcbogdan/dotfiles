id = "local.unified-picker"
name = "Unified Picker"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Combined workspace, agent, and zoxide picker"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open-workspaces"
title = "Open unified picker on workspaces"
contexts = ["workspace", "pane"]
command = ["./target/release/herdr-picker", "--open", "workspaces"]

[[actions]]
id = "open-agents"
title = "Open unified picker on agents"
contexts = ["workspace", "pane"]
command = ["./target/release/herdr-picker", "--open", "agents"]

[[panes]]
id = "picker"
title = "Picker"
placement = "popup"
width = "90%"
height = "80%"
command = ["./target/release/herdr-picker"]
